{% extends "admin/base_site.html" %}

{% block content %}
<h2>Send Email</h2>

<style>
/* General styling for the form */
form {
    max-width: 600px;
    margin: 20px auto;
    padding: 20px;
    background-color: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

form label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

form select {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background-color: #f8f8f8;
    box-sizing: border-box;
    font-size: 14px;
    color: #333;
    height: 150px;
    overflow-y: auto;
}

/* Styled dropdown options */
form select option {
    padding: 10px;
    background-color: #f8f8f8;
    border-bottom: 1px solid #ddd;
    color: #333;
    cursor: pointer;
}

form select option:hover {
    background-color: #007bff;
    color: #fff;
}

/* Text inputs and textarea styling */
form input[type="text"], 
form textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background-color: #f8f8f8;
    box-sizing: border-box;
}

form textarea {
    height: 120px;
    resize: none;
}

/* Submit button styling */
form button {
    display: inline-block;
    padding: 10px 20px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}

form button:hover {
    background-color: #0056b3;
}

/* Feedback messages */
.alert {
    padding: 10px;
    margin: 15px 0;
    border-radius: 5px;
}

.alert.success {
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}

.alert.error {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}

/* Select all checkbox styling */
.select-all-container {
    margin-bottom: 15px;
}
</style>

<form method="post" id="email-form">
    {% csrf_token %}

    <!-- Dropdown for selecting emails -->
    <div class="select-all-container">
        <input type="checkbox" id="select-all" onclick="toggleSelectAll()"> 
        <label for="select-all">Select All</label>
    </div>

    <label for="address">To:</label>
    <select name="address" id="address" multiple>
        <option value="all">All Ward Officers</option>
        {% for officer in officers %}
            <option value="{{ officer.email }}">{{ officer.username }} ({{ officer.email }})</option>
        {% endfor %}
    </select>

    <!-- Subject -->
    <label for="subject">Subject:</label>
    <input type="text" name="subject" id="subject" placeholder="Enter email subject" required>

    <!-- Message -->
    <label for="message">Message:</label>
    <textarea id="message" name="message" placeholder="Enter your message" required></textarea>

    <!-- Submit button -->
    <button type="submit">Send Email</button>
</form>

<!-- Feedback Messages -->
{% if messages %}
    <div>
        {% for message in messages %}
            <p class="alert {{ message.tags }}">{{ message }}</p>
        {% endfor %}
    </div>
{% endif %}

<script>
/* JavaScript to handle "Select All" functionality */
function toggleSelectAll() {
    const selectAllCheckbox = document.getElementById("select-all");
    const emailSelect = document.getElementById("address");

    for (const option of emailSelect.options) {
        option.selected = selectAllCheckbox.checked;
    }
}
</script>
{% endblock %}
